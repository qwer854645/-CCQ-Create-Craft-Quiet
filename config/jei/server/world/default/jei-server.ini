# 名称：服务端作弊权限
# 说明：选择谁可以在此服务器上使用 JEI 作弊模式。
[permissions]
	# 名称：允许管理员使用作弊模式
	# 说明：允许拥有管理员权限（/op）的玩家使用 JEI 作弊模式。
	# 有效值：[true, false]
	# 默认值：true
	enableCheatModeForOp = true

	# 名称：允许创造模式使用作弊模式
	# 说明：允许创造模式玩家使用 JEI 作弊模式。
	# 有效值：[true, false]
	# 默认值：true
	enableCheatModeForCreative = true

	# 名称：允许拥有 Give 权限的玩家使用作弊模式
	# 说明：允许可以使用 /give 命令的玩家使用 JEI 作弊模式。
	# 有效值：[true, false]
	# 默认值：false
	enableCheatModeForGive = false


